name: Refresh daily loan ETF holdings

on:
  schedule:
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: python -m pip install openpyxl==3.1.5

      - name: Refresh official SRLN and BKLN holdings
        run: python bdc-dashboard/scripts/export-daily-loan-etf-holdings.py

      - name: Commit refreshed snapshots
        shell: bash
        run: |
          if git diff --quiet -- bdc-dashboard/lib/daily-loan-etf-holdings.json bdc-dashboard/public/data/loan-etf-holdings; then
            echo "Official fund data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bdc-dashboard/lib/daily-loan-etf-holdings.json bdc-dashboard/public/data/loan-etf-holdings
          git commit -m "chore: refresh daily SRLN and BKLN holdings"
          git push origin HEAD:master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bdc-dashboard/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: bdc-dashboard

      - name: Build static dashboard
        run: npm run build
        working-directory: bdc-dashboard
        env:
          GITHUB_PAGES: "true"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bdc-dashboard/out

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
